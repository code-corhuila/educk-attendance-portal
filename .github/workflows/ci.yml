name: ci

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: educk-attendance-portal
    steps:
      - uses: actions/checkout@v4
        with:
          path: educk-attendance-portal
      - name: Check out the shared HTTP client
        uses: actions/checkout@v4
        with:
          repository: code-corhuila/educk-front
          ref: 00d87370f0ec9bccb851131aee1a388adc19d2bd
          path: educk-front
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-package-lock
      - run: npm test
      - run: npm run build
